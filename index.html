<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="imagens/icon-pc.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
    <script src="script.js"></script>
    <title>Clima Tempo</title>
</head>

<body>
    <div class="main">
        <div>
            <input type="text" placeholder="Digite o nome da cidade" required class="input-pesquisa">
            <button class="submit" alt="busca" onclick="cliqueiNoBotao()"><img width="15" height="15"
                    src="https://img.icons8.com/ios-filled/50/search--v1.png" alt="search--v1" /></button>
            <div class="tempo">
                <h2 class="texto">Tempo em São Paulo</h2>
                <div class="temperatura">
                    <img class="termometro" width="30" height="30" src="https://img.icons8.com/ultraviolet/40/temperature--v1.png" alt="temperature--v1"/>
                    <p class="graus">12ºC</p>
                </div>
            </div>
                <div class="clima">
                    <img class="img-tempo" src="https://openweathermap.org/img/wn/04n.png" alt="nuvem" />
                    <p class="info-clima">Predominantemente Limpo</p>
                </div>
                <div class="info">
                    <p class="umidade">Umidade: 60%</p>
                    <img width="20" height="20" class="img-vento" src="https://img.icons8.com/fluency/48/wind.png" alt="wind"/>
                    <p class="vento"> 10 km/h </p>
                </div>
            </div>
</body>

</html>
